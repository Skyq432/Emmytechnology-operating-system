name: One-time Spin Route Lint Fix

on:
  push:
    branches:
      - security/supabase-reconciliation-20260912

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'chore: stage one-time spin route lint cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/supabase-reconciliation-20260912
      - name: Apply narrow type cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/api/marketing/spin-wheel/route.ts')
          text = path.read_text()
          replacements = {
              'const db: any = new Proxy(\n  {},': 'const db = new Proxy(\n  {} as ReturnType<typeof getSupabaseAdmin>,',
              '      const client: any = getSupabaseAdmin();\n      const value = client[property];': '      const client = getSupabaseAdmin();\n      const value = client[property as keyof typeof client];',
              'type Row = Record<string, any>;': 'type Row = Record<string, unknown>;',
              'async function authorized(_req?: NextRequest) {': 'async function authorized() {',
              'if (!(await authorized(req))) return deny();': 'if (!(await authorized())) return deny();',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm .github/workflows/one-time-spin-route-lint-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/api/marketing/spin-wheel/route.ts .github/workflows/one-time-spin-route-lint-fix.yml
          git commit -m "fix: make spin wheel admin route lint clean"
          git push origin HEAD:security/supabase-reconciliation-20260912
