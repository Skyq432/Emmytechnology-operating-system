name: Security migration hash audit

on:
  push:
    branches:
      - security/supabase-reconciliation-20260912
  workflow_dispatch:

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash checked-in migrations
        shell: bash
        run: |
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z | xargs -0 md5sum
      - name: Find direct client access to security-review tables
        shell: bash
        run: |
          TABLES='ambassador_bonuses|identities|identity_signals|identity_events|identity_signal_weights|identity_ambassador_conflicts|identity_match_suggestions|lead_events|lead_signals|product_interests|referral_route_logs|admin_notifications|crm_notifications|crm_audit_logs|crm_followups|crm_communications|crm_files|crm_quote_items|crm_funnel_stages|crm_funnel_events|crm_quotes|crm_products|crm_sale_items|crm_sales|crm_invoices|crm_receipts|conversation_message_bank|spin_user_prizes|spin_players|spin_cashout_requests|spin_prizes|spin_dm_clicks|spin_referrals|spin_logs|spin_game_settings|spin_letter_segments|spin_rule_groups|spin_rule_items|spin_transactions|spin_user_rule_usage|spin_referral_awards'
          echo '=== Direct Supabase .from(...) references ==='
          grep -RInE "\.from\(['\"]($TABLES)['\"]\)" src scripts 2>/dev/null || true
          echo '=== Any source references to reviewed tables ==='
          grep -RInE "($TABLES)" src scripts 2>/dev/null | head -1000 || true
      - name: Detect safe Supabase CLI connection method
        id: creds
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          echo "access_token=$([[ -n ${ACCESS_TOKEN:-} ]] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "db_password=$([[ -n ${DB_PASSWORD:-} ]] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "database_url=$([[ -n ${DATABASE_URL:-} ]] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "supabase_database_url=$([[ -n ${SUPABASE_DATABASE_URL:-} ]] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "SUPABASE_ACCESS_TOKEN_SET=$([[ -n ${ACCESS_TOKEN:-} ]] && echo yes || echo no)"
          echo "SUPABASE_DB_PASSWORD_SET=$([[ -n ${DB_PASSWORD:-} ]] && echo yes || echo no)"
          echo "DATABASE_URL_SET=$([[ -n ${DATABASE_URL:-} ]] && echo yes || echo no)"
          echo "SUPABASE_DATABASE_URL_SET=$([[ -n ${SUPABASE_DATABASE_URL:-} ]] && echo yes || echo no)"
      - name: Fetch migration history via database URL
        if: steps.creds.outputs.database_url == 'yes' || steps.creds.outputs.supabase_database_url == 'yes'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="${SUPABASE_DATABASE_URL:-${DATABASE_URL:-}}"
          rm -rf /tmp/supabase-history
          mkdir -p /tmp/supabase-history
          cd /tmp/supabase-history
          npx --yes supabase@latest init
          echo '=== REMOTE MIGRATION LIST BEFORE FETCH ==='
          npx --yes supabase@latest migration list --db-url "$DB_URL"
          npx --yes supabase@latest migration fetch --db-url "$DB_URL"
          echo '=== FETCHED REMOTE MIGRATIONS ==='
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort
          echo '=== FETCHED HASHES ==='
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z | xargs -0 md5sum
      - name: Fetch migration history via linked project
        if: steps.creds.outputs.database_url != 'yes' && steps.creds.outputs.supabase_database_url != 'yes' && steps.creds.outputs.access_token == 'yes' && steps.creds.outputs.db_password == 'yes'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/supabase-history
          mkdir -p /tmp/supabase-history
          cd /tmp/supabase-history
          npx --yes supabase@latest init
          npx --yes supabase@latest link --project-ref autndhyvgfndaiahonlx --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@latest migration list --linked
          npx --yes supabase@latest migration fetch --linked
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort
      - name: Upload fetched migration history
        if: always() && hashFiles('/tmp/supabase-history/supabase/migrations/*.sql') != ''
        uses: actions/upload-artifact@v4
        with:
          name: linked-supabase-migrations
          path: /tmp/supabase-history/supabase/migrations
          if-no-files-found: ignore
