name: Security migration reconciliation

on:
  push:
    branches:
      - security/supabase-reconciliation-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore: reconcile migration history from live ledger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact live migration ledger
        shell: bash
        env:
          SUPABASE_URL: https://autndhyvgfndaiahonlx.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_mdVQiRLR6HVJhEcv7KnWOQ_1Yc1fz70
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/rpc/_temporary_migration_history_export" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            -o /tmp/live-migrations.json
          python - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path('/tmp/live-migrations.json').read_text())
          if len(rows) < 60:
              raise SystemExit(f'Expected at least 60 live migrations, got {len(rows)}')

          active = Path('supabase/migrations')
          archive = Path('supabase/migrations_archive/2026-09-12-pre-reconciliation')
          archive.mkdir(parents=True, exist_ok=True)

          for old in sorted(active.glob('*.sql')):
              target = archive / old.name
              if target.exists():
                  target.unlink()
              old.rename(target)

          active.mkdir(parents=True, exist_ok=True)
          manifest = []
          for row in rows:
              version = row['version']
              name = row['name']
              sql = row['sql'] or ''
              filename = f'{version}_{name}.sql'
              (active / filename).write_text(sql.rstrip() + '\n', encoding='utf-8')
              manifest.append({'version': version, 'name': name, 'file': filename})

          Path('/tmp/live-migration-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(f'Reconstructed {len(rows)} exact live migration files.')
          PY
      - name: Verify active migration versions match exported ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          expected = [x['file'] for x in json.loads(Path('/tmp/live-migration-manifest.json').read_text())]
          actual = sorted(p.name for p in Path('supabase/migrations').glob('*.sql'))
          if sorted(expected) != actual:
              missing = sorted(set(expected)-set(actual))
              extra = sorted(set(actual)-set(expected))
              raise SystemExit(f'Migration mismatch. Missing={missing} Extra={extra}')
          print(f'Active migration directory exactly matches {len(actual)} live versions.')
          PY
      - name: Commit reconciliation back to security branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations supabase/migrations_archive
          if git diff --cached --quiet; then
            echo 'No migration-history changes to commit.'
            exit 0
          fi
          git commit -m 'chore: reconcile migration history from live ledger'
          git push origin HEAD:security/supabase-reconciliation-20260912
