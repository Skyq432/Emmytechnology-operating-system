name: Staff RBAC feature verification

on:
  push:
    branches:
      - feature/staff-rbac-mvp
      - security/**
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:auth
      - run: npm run test:work
      - run: npm run test:commercial
      - name: Lint feature TypeScript changes
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi
          npx eslint "${files[@]}"
      - name: Capture full-repository lint baseline
        continue-on-error: true
        run: npm run lint -- --format json --output-file lint-report.json
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: ignore
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
