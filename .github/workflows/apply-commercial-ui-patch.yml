name: Apply receipt access patch

on:
  push:
    branches:
      - testing/vscode-real-life-validation-20260912
    paths:
      - .github/workflows/apply-commercial-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing/vscode-real-life-validation-20260912
      - name: Apply receipt access patch
        run: python scripts/receipt-access-patch.py
      - name: Commit receipt changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/sales/documents/document-service.ts src/lib/operations/repair-server.ts 'src/app/modules/operations/repairs/[id]/page.tsx'
          git diff --cached --check
          git commit -m "fix: authorise server-side receipt rendering and viewing"
          git push origin HEAD:testing/vscode-real-life-validation-20260912
